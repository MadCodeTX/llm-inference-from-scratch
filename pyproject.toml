[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-inference-from-scratch"
version = "0.1.0"
description = "Educational, dissected LLM inference in Python + PyTorch: from tensors to serving Qwen-class models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nick" }]
dependencies = ["torch", "numpy"]

[project.optional-dependencies]
hf = ["safetensors", "transformers", "huggingface_hub"]
dev = ["pytest"]

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/inference_from_scratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
